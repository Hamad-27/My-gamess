<!DOCTYPE html>
<html>
<head>
  <title>GameZone</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #151515;
      color: white;
    }

    header {
      padding: 20px;
      background: #ff4b4b;
      text-align: center;
    }

    h1 {
      margin: 0;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      padding: 20px;
    }

    .game {
      background: #292929;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
    }

    .game img {
      width: 100%;
      border-radius: 10px;
    }

    button {
      background: #ff4b4b;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <header>
    <h1>🎮 GameZone</h1>
    <p>Play free games online!</p>
  </header>

  <main class="games">

    <div class="game">
      <h2>Snake</h2>
      <p>A fun classic game.</p>
      <button>Play</button>
    </div>

    <div class="game">
      <h2>Car Racing</h2>
      <p>Race and win!</p>
      <button>Play</button>
    </div>

    <div class="game">
      <h2>Space Game</h2>
      <p>Explore space!</p>
      <button>Play</button>
    </div>

  </main>
</body>
</html>
